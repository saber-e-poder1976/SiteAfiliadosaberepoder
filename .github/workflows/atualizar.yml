name: Atualizar Produtos Shopee
run-name: 🤖 Atualização automática de produtos
on:
  schedule:
    - cron: '0 12 * * *'  # Roda todo dia às 12h UTC → 9h da manhã Brasil
  workflow_dispatch:      # Permite rodar manualmente pelo site

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script de atualização
        env:
          SHOPEE_DATAFEED_URL: ${{ secrets.SHOPEE_DATAFEED_URL }}
        run: |
          python scripts/atualizar-shopee-v2.py

      - name: Enviar arquivos atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/produtos.json data/categorias.json
          git commit -m "🤖 Atualização automática de produtos" || echo "Sem alterações para enviar"
          git push